name: _Reusable — Docker image release

# Reusable (workflow_call): release an Ekwi instance as a Docker image — build ekwi_prod, push to GHCR
# (and an optional self-hosted registry), then cut the GitHub Release. The PR CI gate calls this same workflow with
# dry-run: true (build only, no version/gate/push/release), so the build logic lives once.
on:
  workflow_call:
    inputs:
      channel:
        description: "pre-release (cuts X.Y.Z-beta.N) or latest (cuts a stable X.Y.Z). Forwarded from the caller's dispatch."
        required: true
        type: string
      initial-version:
        description: 'Version emitted for the very first release, when the repository has no tag yet.'
        required: false
        type: string
        default: '0.1.0'
      ci-workflows:
        description: 'Space-separated workflow filenames that must have a successful run on the release commit — the green gate. Ignored under dry-run.'
        required: false
        type: string
        default: ''
      image-name:
        description: 'Image path under the registry (owner/name). Defaults to the calling repository (github.repository).'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Path to the Dockerfile.'
        required: false
        type: string
        default: 'docker/php/Dockerfile'
      build-target:
        description: 'Dockerfile stage to build and ship.'
        required: false
        type: string
        default: 'ekwi_prod'
      build-context:
        description: 'Build context.'
        required: false
        type: string
        default: '.'
      build-args:
        description: >-
          Extra NON-SECRET build args, one KEY=value per line (forwarded to buildx --build-arg). Do not hard-code
          the base major here: a value copied from an example pins a base image the caller did not choose. The
          README shows one way to read it from the calling repository.
        required: false
        type: string
        default: ''
      base-image-pins:
        description: >-
          Base images to pin by digest, one `<ref>=sha256:<64 lowercase hex>` per line. The ref is the FROM
          line AFTER the ARG expansion — `ekwi/php:5-builder`, not `ekwi/php:${PHP_IMAGE_VERSION}-builder`.
          Empty (the default) changes nothing. When set it is ENFORCED: every base of the built target must
          have been resolved through one of these digests, or the build fails — see the gate step for why
          that check is not optional. The README shows how to read a digest and why both callers need the
          same list.
        required: false
        type: string
        default: ''
      platform:
        description: 'Target platform. Single: the push path and the pin gate handle one — see the build step.'
        required: false
        type: string
        default: 'linux/amd64'
      ghcr-registry:
        description: 'GHCR host.'
        required: false
        type: string
        default: 'ghcr.io'
      self-hosted-registry:
        description: 'Optional self-hosted registry host (e.g. registry.ekwi.tech). When set, the image goes to a second registry beside GHCR and deployments pull it under this name. Empty = GHCR only. See self-hosted-push-registry when writes use another name.'
        required: false
        type: string
        default: ''
      self-hosted-push-registry:
        description: >-
          Host to WRITE to, when it differs from the one deployments read from. Empty (the default) writes to
          `self-hosted-registry`. A registry stores `<repository>:<tag>` and no host, so an image written by
          one name is pulled by any other name serving the same registry — see the README.
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Build only — no version, no green gate, no push, no release. This is the PR CI gate mode.'
        required: false
        type: boolean
        default: false
    secrets:
      composer-auth:
        description: 'COMPOSER_AUTH JSON for reading private Composer packages at build (BuildKit secret), e.g. {"github-oauth":{"github.com":"<token>"}}.'
        required: true
      dockerhub-user:
        description: 'Optional Docker Hub username to authenticate base-image pulls (ekwi/php) and lift the anonymous rate limit.'
        required: false
      dockerhub-token:
        description: 'Optional Docker Hub token paired with dockerhub-user.'
        required: false
      registry-user:
        description: 'Username for the host that is WRITTEN to — self-hosted-push-registry when set, otherwise self-hosted-registry. Required only on a real run.'
        required: false
      registry-token:
        description: 'Token/password for the host that is WRITTEN to. Required only when self-hosted-registry is set on a real run.'
        required: false

# Keyed on the calling workflow, not just the ref: the dry-run gate runs on `push: main` too, so keying on the ref
# alone would share a group with a real release on `main` and serialise them. The gate cancels superseded runs; a
# real release never cancels (an interrupted push could leave a tag without its image).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.dry-run }}

jobs:
  release:
    # "scan" is historical: the name is a published contract — .github/published-check-names.txt.
    name: Build the instance image, scan, push and release
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a full image build (composer + vite + pnpm) is heavier than tag-only; must not hang for hours
    # NO job-level `permissions:` — inherited from the caller. Real callers grant contents:write + packages:write +
    # actions:read + pull-requests:read; the dry-run gate grants read only.
    steps:
      # Fail loudly on a bad contract. Also emits flags so later `if:` conditions never read the `secrets` context.
      - name: Validate inputs
        id: validate
        env:
          CHANNEL: ${{ inputs.channel }}
          CI_WORKFLOWS: ${{ inputs.ci-workflows }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
          DRY_RUN: ${{ inputs.dry-run }}
          SELF_HOSTED: ${{ inputs.self-hosted-registry }}
          SELF_HOSTED_PUSH: ${{ inputs.self-hosted-push-registry }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhub-token }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
        run: |
          set -euo pipefail
          case "${CHANNEL}" in
            pre-release|latest) ;;
            *) echo "::error::channel must be 'pre-release' or 'latest', got '${CHANNEL}'"; exit 1 ;;
          esac
          if ! printf '%s' "${INITIAL_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::initial-version must be X.Y.Z (no leading v), got '${INITIAL_VERSION}'"; exit 1
          fi
          if [ "${DRY_RUN}" != "true" ] && [ -z "${CI_WORKFLOWS// /}" ]; then
            echo "::error::ci-workflows is empty — the green gate would pass without checking anything"; exit 1
          fi
          if [ -n "${SELF_HOSTED}" ] && [ "${DRY_RUN}" != "true" ] && [ -z "${REGISTRY_TOKEN}" ]; then
            echo "::error::self-hosted-registry is set but the registry-token secret is missing"; exit 1
          fi
          if [ -n "${SELF_HOSTED_PUSH}" ]; then
            [ -n "${SELF_HOSTED}" ] \
              || { echo "::error::self-hosted-push-registry is set without self-hosted-registry — the dual-push is driven by the latter"; exit 1; }
            # A bare lowercase name is not read as a host: measured, `docker pull registry/o/n:1` goes to
            # Docker Hub while the login goes to the host named here. Shape first, then that rule.
            printf '%s' "${SELF_HOSTED_PUSH}" | grep -qE '^[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]+)?$' \
              || { echo "::error::self-hosted-push-registry '${SELF_HOSTED_PUSH}' is not a host — expected name or name:port, with no scheme and no path"; exit 1; }
            case "${SELF_HOSTED_PUSH}" in
              localhost|localhost:*|*.*|*:*) ;;
              *) echo "::error::self-hosted-push-registry '${SELF_HOSTED_PUSH}' resolves to Docker Hub, not to a host — add the port (registry:5000) or use a dotted name"; exit 1 ;;
            esac
          fi
          echo "has-dockerhub=$([ -n "${DOCKERHUB_TOKEN}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Real runs publish from main only. Skipped under dry-run: the gate runs on a PR branch.
      - name: Refuse to release from a branch other than main
        if: ${{ !inputs.dry-run }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Releases are cut from main only — this run targets '${GITHUB_REF_NAME}'"; exit 1
          fi

      # fetch-depth: 0 — next-version-action and release-notes-action read every tag and the full commit graph.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve image path
        id: img
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail
          name="${IMAGE_NAME:-$GITHUB_REPOSITORY}"
          name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"   # registries require lowercase paths
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Compute the next version
        id: version
        if: ${{ !inputs.dry-run }}
        uses: ekwi-tech/next-version-action@6bc05ac16f2b8c1906710f3c6b462f6c26ad631f # v0.1.0
        with:
          prerelease: ${{ inputs.channel == 'pre-release' }}
          initial-version: ${{ inputs.initial-version }}

      - name: Refuse to overwrite an existing tag
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists"; exit 1
          fi

      - name: Require a successful CI run on this commit
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOWS: ${{ inputs.ci-workflows }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          for wf in ${CI_WORKFLOWS}; do
            # Capture the body (2>&1) so an HTTP error is told apart from a legitimately-absent green run.
            if ! runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${SHA}&per_page=100" 2>&1)"; then
              case "$runs" in
                *'HTTP 403'*) echo "::error::Cannot read Actions runs for '${wf}' — the caller must grant 'actions: read'" ;;
                *'HTTP 404'*) echo "::error::Workflow '${wf}' not found — does .github/workflows/${wf} exist?" ;;
                *)            echo "::error::Querying runs for '${wf}' failed: ${runs}" ;;
              esac
              exit 1
            fi
            green="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
            if [ "${green}" -eq 0 ]; then
              running="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status != "completed")] | length')"
              if [ "${running}" -gt 0 ]; then
                echo "::error::'${wf}' is still running for ${SHA} — wait for it to go green, then re-dispatch"
              else
                echo "::error::No successful '${wf}' run for ${SHA} — refusing to release an untested commit"
              fi
              exit 1
            fi
            echo "  ${wf}: green for ${SHA}"
          done

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Base images (ekwi/php:*) are on PUBLIC Docker Hub — authenticate ONLY if creds are provided, to lift the
      # anonymous pull rate limit on busy CI. Anonymous still works for occasional builds.
      - name: Log in to Docker Hub (base images)
        if: ${{ steps.validate.outputs.has-dockerhub == 'true' }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.dockerhub-user }}
          password: ${{ secrets.dockerhub-token }}

      - name: Log in to GHCR
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ inputs.ghcr-registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The credential belongs to the host we WRITE to, which may not be the one deployments read from.
      - name: Log in to the self-hosted registry
        if: ${{ !inputs.dry-run && inputs.self-hosted-registry != '' }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ inputs.self-hosted-push-registry || inputs.self-hosted-registry }}
          username: ${{ secrets.registry-user }}
          password: ${{ secrets.registry-token }}

      # Its own step so ci.yml can extract and run it.
      # Each pin is a named build context keyed on the FROM reference AFTER the ARG expansion — the literal
      # `${…}` form is rejected as an invalid reference.
      - name: Compose the base-image pins
        id: pins
        if: inputs.base-image-pins != ''
        env:
          BASE_IMAGE_PINS: ${{ inputs.base-image-pins }}
          # Outside the checkout, like the metadata file: the workspace IS the default build context, and a
          # caller with a permissive .dockerignore would COPY these into a later image.
          PIN_ARGS_FILE: ${{ runner.temp }}/pin-build-contexts
          PINS_FILE: ${{ runner.temp }}/pinned-base-digests
        run: |
          set -euo pipefail
          : > "${PIN_ARGS_FILE}"
          : > "${PINS_FILE}"
          while IFS= read -r line; do
            [ -n "$(printf '%s' "${line}" | tr -d '[:space:]')" ] || continue
            # \r: the digests are meant to live in a file the consumer owns, and one edited on Windows would
            # make the digest 65 characters. The composite .env reader strips it for the same reason.
            line="$(printf '%s' "${line}" | tr -d '\r')"
            ref="${line%%=*}"
            digest="${line#*=}"
            # The full shape, not just the length: an UPPERCASE digest copied from a registry UI has 64
            # characters, would pass a length check, and then fail inside buildx on `invalid checksum digest
            # format` — later and further from the cause, which is what this guard exists to avoid.
            printf '%s' "${digest}" | grep -qE '^sha256:[0-9a-f]{64}$' \
              || { echo "::error::base-image-pins: '${line}' — expected <ref>=sha256:<64 lowercase hex>"; exit 1; }
            # The tag is kept: buildx then writes `img@tag?digest=…`, the key the gate pairs with the digest.
            printf -- '--build-context\n%s=docker-image://%s@%s\n' "${ref}" "${ref}" "${digest}" >> "${PIN_ARGS_FILE}"
            # The purl key buildx will write for this ref: the tag goes after `@`, not `:`.
            # ⚠ A registry with a PORT is out of scope: buildx percent-encodes it (`localhost%3A5000/img`),
            # so this key would never match and the build would be refused. Short and namespaced Docker Hub
            # names are what the fleet uses.
            key="${ref}"
            case "${ref##*/}" in *:*) key="${ref%:*}@${ref##*:}" ;; esac
            printf '%s %s\n' "${key}" "${digest#sha256:}" >> "${PINS_FILE}"
          done <<< "${BASE_IMAGE_PINS}"
          {
            echo "args-file=${PIN_ARGS_FILE}"
            echo "pins-file=${PINS_FILE}"
          } >> "$GITHUB_OUTPUT"

      # GitHub-hosted only: a global rm on a shared self-hosted runner could hit concurrent jobs.
      # Kept until measured — `--load` stores the image twice (builder cache, daemon). The two `df` are the
      # measure: compare them over a few runs, then decide. It costs ~90 s.
      - name: Free runner disk space (best-effort)
        if: runner.environment == 'github-hosted'
        run: |
          df -h / | tail -1 || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1 || true

      # `--load`: the push step tags and pushes from the local daemon, so the image must be in it.
      # Single-platform is a choice (production is amd64), not a limit of the flag. An ARM target means a
      # native arm64 leg — QEMU does not survive composer + vite — hence a per-arch push by digest and a
      # merge job, as docker-php does, and a pin gate taught the multi-platform provenance shape.
      - name: Build the image
        id: build
        env:
          # A BuildKit secret, never a layer.
          COMPOSER_AUTH: ${{ secrets.composer-auth }}
          LOCAL_REF: local-ci/${{ steps.img.outputs.name }}:build-${{ github.sha }}
          BUILD_ARGS: ${{ inputs.build-args }}
          PIN_ARGS_FILE: ${{ steps.pins.outputs.args-file }}
          # `min` pinned: `disabled` would drop the materials the gate reads. ⚠ The file still holds every
          # build-arg value and secret ID (`invocation.parameters`): never upload it, never cat it into a log.
          BUILDX_METADATA_PROVENANCE: min
          # Outside the checkout, same reason as the pin files above.
          METADATA_FILE: ${{ runner.temp }}/build-metadata.json
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r line; do
            [ -n "${line// /}" ] && args+=( --build-arg "${line}" )
          done <<< "${BUILD_ARGS}"

          # One `--build-context` and its value per line, written by the step above.
          pins=()
          if [ -s "${PIN_ARGS_FILE:-/nonexistent}" ]; then
            mapfile -t pins < "${PIN_ARGS_FILE}"
          fi

          docker buildx build \
            --platform "${{ inputs.platform }}" \
            --target "${{ inputs.build-target }}" \
            --file "${{ inputs.dockerfile }}" \
            --secret id=composer_auth,env=COMPOSER_AUTH \
            "${args[@]}" \
            "${pins[@]+"${pins[@]}"}" \
            --tag "${LOCAL_REF}" \
            --metadata-file "${METADATA_FILE}" \
            --load \
            "${{ inputs.build-context }}"
          {
            echo "local-ref=${LOCAL_REF}"
            echo "metadata-file=${METADATA_FILE}"
          } >> "$GITHUB_OUTPUT"

      # WHY: ekwi/php:${PHP_IMAGE_VERSION} is a MAJOR-line tag, re-published in place. Without recording which
      # bytes it resolved to, an upstream base change is indistinguishable from a build defect. Read from
      # buildx's own metadata, not from a second lookup of our own: a second lookup can disagree with the
      # resolution the build actually used, which is the exact case this record exists to catch.
      #
      # Consultative only: it must never cost a build that succeeded, hence continue-on-error and the jq guard.
      - name: Record the images by digest
        continue-on-error: true
        env:
          BUILT_REF: ${{ steps.build.outputs.local-ref }}
          METADATA_FILE: ${{ steps.build.outputs.metadata-file }}
        run: |
          # -e on purpose: `continue-on-error` already protects the build, so a broken jq must FAIL this step
          # rather than print an empty digest under a green check. `// "none"` covers a missing key, not a
          # broken tool.
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq not found — image digests were not recorded"
            exit 0
          fi
          if [ ! -f "${METADATA_FILE}" ]; then
            echo "::warning::build-metadata.json missing — image digests were not recorded"
            exit 0
          fi
          {
            echo "### Images by digest"
            echo
            echo "| role | reference | digest |"
            echo "|---|---|---|"
            # For the built target's graph only — an unreached stage's base does not appear.
            # `materials` is the only shape this file can hold today: buildx normalises a v1 predicate with
            # ConvertToSLSA02() before writing (build/provenance.go). The v1 branch below is a belt for the day
            # that conversion goes away — it costs one `+` and never evaluates meanwhile. ⚠ A THIRD shape exists:
            # multi-platform builds suffix the key (`buildx.build.provenance/linux/amd64`) and would read as
            # empty. Out of reach while this workflow is single-platform — see the build step.
            jq -r '
              ((.["buildx.build.provenance"].materials // [])
               + (.["buildx.build.provenance"].buildDefinition.resolvedDependencies // []))
              | [ .[] | select((.uri // "") | startswith("pkg:docker/")) ]
              | if length == 0 then "| base | _no provenance material_ | |"
                else .[] | "| base | `\(.uri)` | `sha256:\(.digest.sha256 // "")` |"
                end
            ' "${METADATA_FILE}"
            # The local ref that was built, and the manifest buildx produced for it. This used to warn that
            # the push recomposes the manifest and returns another digest; measured on a containerd image
            # store — the one the runner has — buildx and the registry return the SAME digest.
            # Assigned, not inlined in printf: under `set -e` the status of a command substitution used as an
            # argument is discarded, so a broken jq would print an empty cell under a green step.
            built_digest=$(jq -r '."containerimage.digest" // "none"' "${METADATA_FILE}")
            # shellcheck disable=SC2016  # the backticks are markdown code spans for the summary table,
            # not a command substitution — single quotes are what keeps them literal.
            printf '| **built** | `%s` | `%s` |\n' \
              "${BUILT_REF}" "${built_digest}"
            echo
            echo "_\`built\` is the manifest buildx produced; on a containerd image store the push returns the same digest._"
          } >> "$GITHUB_STEP_SUMMARY"

      # An input wired to a job output can go empty without anyone noticing, and the gate below is
      # conditioned on it. Say so in the summary rather than let a silently unpinned release look normal.
      - name: Say so when nothing is pinned
        if: inputs.base-image-pins == ''
        run: echo "⚠ Bases were NOT pinned — base-image-pins is empty, so they resolved through their tags." >> "$GITHUB_STEP_SUMMARY"

      # A gate, not a note: buildx SILENTLY IGNORES a --build-context key that matches no FROM — exit 0,
      # green build, base resolved through its tag.
      #
      # ⚠ And it reads the purl, not the digest alone: on the day the pins are written the tag resolves to
      # the very digest that was read to write them, so a mistyped key yields a base that is unpinned AND
      # carries a listed digest. The provenance tells the two apart —
      #   resolved through a pin : pkg:docker/<name>[@<tag>]?digest=sha256:…
      #   resolved through a tag : pkg:docker/<name>@<tag>
      #
      # ⚠ The CI engine floats: `docker-container` on `moby/buildkit:buildx-stable-1`. These shapes are what
      # to re-measure the day the gate refuses everything; `ci.yml` pins them as fixtures.
      - name: Verify every base was pinned
        if: inputs.base-image-pins != ''
        env:
          METADATA_FILE: ${{ steps.build.outputs.metadata-file }}
          PINS_FILE: ${{ steps.pins.outputs.pins-file }}
        run: |
          set -euo pipefail
          # No continue-on-error and no soft exit, unlike the record step above: a pin that cannot be
          # verified must not be announced as one.
          command -v jq >/dev/null 2>&1 \
            || { echo "::error::jq not found — the pin cannot be verified"; exit 1; }
          for f in "${METADATA_FILE}" "${PINS_FILE}"; do
            [ -f "${f}" ] || { echo "::error::${f} is missing — the pin cannot be verified"; exit 1; }
          done

          # Digest, purl key, raw uri. `no-digest` is a sentinel that can never match a pin: `// empty`
          # would drop a material carrying no digest, and the gate would bless what it never observed.
          resolved=$(jq -r '
            ((.["buildx.build.provenance"].materials // [])
             + (.["buildx.build.provenance"].buildDefinition.resolvedDependencies // []))
            | .[] | select((.uri // "") | startswith("pkg:docker/"))
            | "\(.digest.sha256 // "no-digest") \(.uri | sub("^pkg:docker/";"") | sub("[?].*$";"")) \(.uri)"
          ' "${METADATA_FILE}")

          # Refusing is the only safe reading: we cannot claim a pin we did not observe. ⚠ A multi-platform
          # build suffixes the provenance key (`buildx.build.provenance/linux/amd64`) and lands here; this
          # workflow is single-platform by design, so that path means the shape changed under us.
          [ -n "${resolved}" ] || {
            echo "::error::no base image in the provenance — refusing to claim a pin. If this build became multi-platform, the provenance key is now suffixed and this gate must be taught the new shape."
            exit 1
          }

          rc=0
          while IFS=' ' read -r digest key uri; do
            [ -n "${digest}" ] || continue
            case "${uri}" in
              *"digest=sha256:"*) ;;
              *)
                echo "::error::${uri} was resolved through its TAG, not through a pin. Everything buildx pulls is listed here, not just FROM lines: the \`# syntax=\` frontend, an image named by \`COPY --from=<image>\` or \`RUN --mount=from=<image>\`. Add \`${key/@/:}=sha256:…\` to base-image-pins, writing the reference as it appears AFTER ARG expansion."
                rc=1
                continue
                ;;
            esac
            # -x -F on the PAIR: a digest is a literal, and a prefix match would accept a truncated one.
            # ⚠ This proves the build FOLLOWED the list, never that the list is right: two digests swapped
            # between two tags of one image are obeyed to the letter and pass.
            grep -qxF -- "${key} ${digest}" "${PINS_FILE}" \
              || { echo "::error::${uri} resolved to a digest that base-image-pins does not list for ${key}"; rc=1; }
          done <<< "${resolved}"

          [ "${rc}" -eq 0 ] || exit 1
          echo "Every base of the built target was resolved through a pinned digest."

      - name: Push the image
        if: ${{ !inputs.dry-run }}
        env:
          LOCAL_REF: ${{ steps.build.outputs.local-ref }}
          NAME: ${{ steps.img.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          GHCR: ${{ inputs.ghcr-registry }}
          SELF_HOSTED: ${{ inputs.self-hosted-registry }}
          SELF_HOSTED_PUSH: ${{ inputs.self-hosted-push-registry }}
        run: |
          set -euo pipefail
          tags=("${VERSION}")
          # `:latest` tracks the last STABLE release — a pre-release stays reachable by its exact version.
          [ "${CHANNEL}" = "latest" ] && tags+=(latest)

          # A registry stores `<repository>:<tag>` and no host, so what is written under one name is pulled
          # under any name serving the same registry. The reference is built from the WRITE host; the pull
          # host only labels the log, and the job never contacts it.
          push_to() {
            local write_host="$1" pull_host="$2" tag
            for tag in "${tags[@]}"; do
              docker tag "${LOCAL_REF}" "${write_host}/${NAME}:${tag}"
              docker push "${write_host}/${NAME}:${tag}"
              if [ "${write_host}" = "${pull_host}" ]; then
                echo "  pushed ${write_host}/${NAME}:${tag}"
              else
                echo "  pushed ${write_host}/${NAME}:${tag} — pullable as ${pull_host}/${NAME}:${tag}"
              fi
            done
          }

          push_to "${GHCR}" "${GHCR}"
          # An `if`, not `[ … ] && push_to …`: as the last command, a false test would exit the step 1.
          if [ -n "${SELF_HOSTED}" ]; then
            push_to "${SELF_HOSTED_PUSH:-${SELF_HOSTED}}" "${SELF_HOSTED}"
          fi

      - name: Generate the release notes
        id: notes
        if: ${{ !inputs.dry-run }}
        uses: ekwi-tech/release-notes-action@76488d0c9bf8a1d9a8d8677a536232a584bd5f41 # v0.1.0
        with:
          version: ${{ steps.version.outputs.version }}
          token: ${{ github.token }}

      # Publishing == creating the tag + Release; the image already sits in the registry under the same version. A
      # hyphen in the version means pre-release, excluded from GitHub's "Latest".
      - name: Publish the GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          case "$VERSION" in *-*) prerelease_flag="--prerelease" ;; esac
          gh release create "v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            $prerelease_flag

      - name: Dry-run summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "::notice::[dry-run] image built (${{ steps.build.outputs.local-ref }}) — no version, no push, no release. CI gate OK."
